
{% if messages %}

<style>
    .web3-messages {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
    }

    .web3-message {
        min-width: 300px;
        max-width: 380px;
        padding: 16px 18px;
        display: flex;
        align-items: center;
        gap: 13px;

        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 18px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.10),
            0 0 0 1px rgba(255, 255, 255, 0.7) inset;

        color: #111827;
        font-family: "Vazirmatn", sans-serif;
        font-size: 14px;
        font-weight: 600;

        animation:
            web3MessageIn 0.55s cubic-bezier(.22, 1, .36, 1) forwards,
            web3MessageOut 0.5s ease 4.5s forwards;
    }

    .web3-message::before {
        content: "";
        position: absolute;
        right: 0;
        top: 12px;
        bottom: 12px;
        width: 3px;
        border-radius: 10px;
        background: #16a34a;
    }

    .web3-message-icon {
        width: 38px;
        height: 38px;
        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 12px;

        background: rgba(22, 163, 74, 0.10);
        color: #16a34a;

        font-size: 18px;
        font-weight: 900;
    }

    .web3-message-content {
        display: flex;
        flex-direction: column;
        gap: 3px;
    }

    .web3-message-title {
        font-size: 13px;
        font-weight: 800;
        color: #111827;
    }

    .web3-message-text {
        font-size: 13px;
        font-weight: 500;
        color: #4b5563;
        line-height: 1.7;
    }

    @keyframes web3MessageIn {
        from {
            opacity: 0;
            transform: translateX(40px) translateY(-10px) scale(0.96);
        }

        to {
            opacity: 1;
            transform: translateX(0) translateY(0) scale(1);
        }
    }

    @keyframes web3MessageOut {
        from {
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        to {
            opacity: 0;
            transform: translateX(30px) scale(0.96);
        }
    }

    @media (max-width: 600px) {

        .web3-messages {
            top: 16px;
            right: 16px;
            left: 16px;
        }

        .web3-message {
            min-width: 0;
            width: 100%;
            box-sizing: border-box;
        }
    }
</style>


<div class="web3-messages">

    {% for msg in messages %}

        <div class="web3-message">

            <div class="web3-message-icon">
                ✓
            </div>

            <div class="web3-message-content">

                <div class="web3-message-title">
                    عملیات موفق
                </div>

                <div class="web3-message-text">
                    {{ msg }}
                </div>

            </div>

        </div>

    {% endfor %}

</div>

{% endif %}
